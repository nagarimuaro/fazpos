services:
  fazpos:
    build: .
    container_name: fazpos
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - RUST_LOG=info
      - SLINT_BACKEND=winit
      - COMPUTERNAME=FAZPOS-MAC
      - PROCESSOR_IDENTIFIER=CONTAINER-CPU
    volumes:
      - ./data:/app/data
    restart: unless-stopped
