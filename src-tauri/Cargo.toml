[package]
name = "fazpos"
version = "0.1.0"
edition = "2024"
default-run = "fazpos"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
